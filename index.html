<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProMax — транспортна база</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#eef3f7;color:#1d2939}
header{background:#173f5f;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}.wrap{display:flex;min-height:calc(100vh - 64px)}
nav{width:210px;background:#fff;border-right:1px solid #d8dee6;padding:12px}
nav button{width:100%;padding:11px;margin:4px 0;border:0;background:#f0f4f8;text-align:left;border-radius:6px;cursor:pointer}
nav button.active{background:#173f5f;color:#fff}
main{flex:1;padding:22px;overflow:auto}.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{font-size:12px;font-weight:bold;display:block;margin-bottom:4px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:5px}
button.primary{background:#173f5f;color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer}
button.danger{background:#b42318;color:#fff;border:0;padding:7px 10px;border-radius:5px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}th,td{border:1px solid #dbe2e8;padding:7px;white-space:nowrap}th{background:#dceaf4}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff;padding:16px;border-radius:9px}.kpi b{display:block;font-size:22px;margin-top:6px}
.hidden{display:none}.paid{background:#e7f6ea}.unpaid{background:#fde8e8}
.small{font-size:12px;color:#667085}.rating-good{background:#e7f6ea}.rating-mid{background:#fff4cc}.rating-bad{background:#fde8e8}.edit{background:#475467;color:#fff;border:0;padding:7px 10px;border-radius:5px;cursor:pointer}

.report-controls{background:#fff;border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 4px #0001}
.report-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.report-kpi{background:#fff;border:1px solid #e1e7ee;border-radius:10px;padding:15px}
.report-kpi span{display:block;color:#667085;font-size:12px;font-weight:bold}
.report-kpi strong{display:block;font-size:24px;margin-top:7px}
.charts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.chart-card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px #0001;min-height:330px}
.chart-title{font-size:16px;font-weight:bold;margin-bottom:4px}
.chart-sub{font-size:12px;color:#667085;margin-bottom:15px}
.bars{display:flex;align-items:flex-end;gap:12px;height:235px;padding:12px 8px 4px;border-bottom:1px solid #cbd5e1}
.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:35px}
.bar{width:min(52px,80%);background:#173f5f;border-radius:5px 5px 0 0;min-height:2px;position:relative}
.bar-value{font-size:11px;margin-bottom:4px;white-space:nowrap}
.bar-label{font-size:11px;margin-top:7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.pie-wrap{display:flex;align-items:center;gap:24px;min-height:235px}
.pie{width:190px;height:190px;border-radius:50%;background:conic-gradient(#173f5f 0 40%,#4c78a8 40% 65%,#72a0c4 65% 82%,#b8c9d9 82% 100%)}
.legend{font-size:12px;line-height:1.9}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;background:#173f5f}
.legend i.c2{background:#4c78a8}.legend i.c3{background:#72a0c4}.legend i.c4{background:#b8c9d9}
@media(max-width:900px){.charts-grid,.report-kpis{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.charts-grid,.report-kpis{grid-template-columns:1fr}}


/* ProMax 3.0 */
.section-note{font-size:12px;color:#667085;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:bold}
.badge-green{background:#e7f6ea;color:#16743a}.badge-yellow{background:#fff4cc;color:#8a5a00}.badge-red{background:#fde8e8;color:#b42318}.badge-blue{background:#e7f0f8;color:#173f5f}
.status-planned{background:#eef3f7}.status-loading{background:#fff4cc}.status-road{background:#e7f0f8}.status-unloading{background:#f4edff}.status-wait{background:#fff0d9}.status-paid{background:#e7f6ea}
.alert{padding:11px 14px;border-radius:7px;margin:10px 0}.alert-red{background:#fde8e8;color:#8f1d14}.alert-yellow{background:#fff4cc;color:#765000}.alert-green{background:#e7f6ea;color:#166534}
.scroll-x{overflow:auto}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid #e1e7ee;border-radius:9px;padding:12px}.metric span{font-size:11px;color:#667085;display:block}.metric b{font-size:20px;display:block;margin-top:5px}
.small-btn{padding:6px 9px;border:0;border-radius:5px;cursor:pointer;background:#eef3f7}.success{background:#16743a!important;color:#fff}.warn{background:#8a5a00!important;color:#fff}
.print-btn{float:right}
.detail-box{background:#f8fafc;border:1px solid #e1e7ee;border-radius:8px;padding:12px;margin-top:10px}
@media(max-width:800px){.metric-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.metric-grid{grid-template-columns:1fr}}


.oil-ok{background:#e7f6ea}.oil-warn{background:#fff4cc}.oil-danger{background:#fde8e8}
.oil-card{background:#fff;border:1px solid #e1e7ee;border-radius:10px;padding:15px;margin:10px 0}
.oil-card h4{margin:0 0 8px}.oil-status{font-weight:bold}


#loginOverlay{position:fixed;inset:0;background:rgba(8,20,35,.78);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px}
#loginBox{width:min(420px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#loginBox h2{margin-top:0}#loginBox input{width:100%;box-sizing:border-box;margin:10px 0 14px;padding:12px;border:1px solid #ccd5df;border-radius:8px;font-size:18px}
#loginError{color:#b42318;min-height:22px;margin-bottom:8px;font-weight:600}


/* ProMax Mobile Edition */
.mobile-nav{display:none}
@media(max-width:700px){
  html,body{width:100%;min-height:100%;overflow-x:hidden}
  body{font-size:14px;padding-bottom:68px}
  header{position:sticky;top:0;z-index:1000;padding:10px 12px;min-height:44px;box-sizing:border-box}
  header h1{font-size:16px;line-height:1.2}
  #clock{font-size:10px;white-space:nowrap}
  .wrap{display:block;min-height:calc(100vh - 64px)}
  #nav{display:none}
  main{padding:10px 9px 20px;overflow:visible}
  main>h2{font-size:20px;margin:8px 2px 12px}
  .card,.report-controls,.chart-card{border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
  .grid,.metric-grid,.kpis,.report-kpis,.charts-grid{grid-template-columns:1fr!important;gap:9px}
  label{font-size:11px}
  input,select{min-height:42px;font-size:16px;padding:9px}
  button.primary,button.edit,button.danger,.small-btn{min-height:40px;font-size:14px;padding:9px 11px}
  .toolbar{gap:6px}
  .toolbar>*{max-width:100%}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:12px;min-width:760px}
  th,td{padding:7px 6px}
  .chart-card{min-height:260px}
  .bars{height:180px;gap:6px}
  .pie-wrap{flex-direction:column;align-items:flex-start;gap:12px}
  .pie{width:150px;height:150px}
  .print-btn{float:none}
  .detail-box{padding:10px}
  .badge{font-size:10px}
  .mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid #d8dee6;z-index:9999;padding:4px 4px env(safe-area-inset-bottom);box-sizing:content-box;box-shadow:0 -3px 12px #0001}
  .mobile-nav button{border:0;background:transparent;border-radius:8px;font-size:10px;line-height:1.15;padding:5px 2px;color:#475467}
  .mobile-nav button span{display:block;font-size:19px;margin-bottom:2px}
  .mobile-nav button.active{background:#173f5f;color:#fff}
  .mobile-more{position:fixed;left:8px;right:8px;bottom:70px;background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:8px;z-index:9998;box-shadow:0 8px 30px #0002;display:none}
  .mobile-more.open{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mobile-more button{padding:10px;border:0;border-radius:8px;background:#f0f4f8;text-align:left}
  .mobile-more button.active{background:#173f5f;color:#fff}
}
@media(max-width:380px){header h1{font-size:14px}#clock{font-size:9px}.mobile-nav button{font-size:9px}.mobile-nav button span{font-size:17px}}

</style>
<link rel="manifest" href="ProMax_MOBILE_CLOUD.webmanifest"><meta name="theme-color" content="#173f5f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ProMax"><link rel="apple-touch-icon" href="ProMax-icon-192.png">
<!-- Supabase cloud backend -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><h1>ProMax — транспортна база</h1><div style="display:flex;align-items:center;gap:10px"><button id="installBtn" class="primary" style="display:none" onclick="installProMax()">📲 Додати ProMax на головний екран</button><div id="clock"></div></div></header>
<div class="wrap">
<nav id="nav">
<button data-page="dashboard" class="active">🏠 Головна</button>
<button data-page="trips">🚛 Рейси</button>
<button data-page="expenses">💸 Витрати</button>
<button data-page="funds">💰 Фактичні кошти</button>
<button data-page="customers">🏢 Замовники</button>
<button data-page="drivers">👤 Водії</button><button data-page="logisticians">🤝 Логісти</button>
<button data-page="vehicles">🚚 Автомобілі</button>
<button data-page="cities">📍 Міста</button>
<button data-page="distances">↔ Відстані</button>
<button data-page="debtors">💳 Дебіторка</button><button data-page="reports">📊 Звіти</button>
<button data-page="backup">💾 Резервна копія</button>
</nav>
<main id="app"></main>
</div>
<div class="mobile-more" id="mobileMore">
  <button data-page="customers">🏢 Замовники</button>
  <button data-page="drivers">👤 Водії</button>
  <button data-page="logisticians">🤝 Логісти</button>
  <button data-page="vehicles">🚚 Автомобілі</button>
  <button data-page="cities">📍 Міста</button>
  <button data-page="distances">↔ Відстані</button>
  <button data-page="debtors">💳 Дебіторка</button>
  <button data-page="reports">📊 Звіти</button>
  <button data-page="backup">💾 Резервна копія</button>
</div>
<div class="mobile-nav" id="mobileNav">
  <button data-page="dashboard"><span>🏠</span>Головна</button>
  <button data-page="trips"><span>🚛</span>Рейси</button>
  <button data-page="expenses"><span>💸</span>Витрати</button>
  <button data-page="funds"><span>💰</span>Кошти</button>
  <button id="mobileMoreBtn"><span>☰</span>Ще</button>
</div>
<script>
const KEY='promax_db_v1';
let db={};
try{ db=JSON.parse(localStorage.getItem(KEY)||'{}'); }
catch(e){
  console.warn('ProMax: пошкоджені локальні дані, створюється нова структура.',e);
  db={};
}
const ensureArray=k=>{if(!Array.isArray(db[k])) db[k]=[]};
['trips','expenses','customers','drivers','logisticians','vehicles','cities','distances','debts','maintenance','tripDocuments'].forEach(ensureArray);
if(!db.logisticians) db.logisticians=[];

if(!db.debts) db.debts=[];
if(!db.vehicles) db.vehicles=[];
if(!db.maintenance) db.maintenance=[];
if(!db.tripDocuments) db.tripDocuments=[];
if(!db.drivers) db.drivers=[];
if(!db.customers) db.customers=[];
(db.trips||[]).forEach((t,idx)=>{
  if(!t.uid) t.uid='trip_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).slice(2);
  if(!t.status) t.status=t.payment==='так'?'Оплачено':'Очікує оплату';
  if(!('driverId' in t)) t.driverId='';
  if(!('vehicleId' in t)) t.vehicleId='';
  if(!('routeDistance' in t)) t.routeDistance=findDistance(t.loadCity,t.unloadCity)||0;
  if(!('actualFuel' in t)) t.actualFuel='';
  if(!('maintenanceKm' in t)) t.maintenanceKm='';
});
// Convert old document references that used the trip array index to stable trip IDs.
(db.tripDocuments||[]).forEach(d=>{
  if(d && typeof d.tripId==='number' && db.trips[d.tripId]) d.tripId=db.trips[d.tripId].uid;
});

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(db)); scheduleCloudPush(); return true;}
 catch(e){
   console.error('ProMax save error',e);
   alert('Не вдалося зберегти базу. Сховище браузера переповнене. Видаліть зайві великі документи у «Рейси → Документи» або зробіть резервну копію.');
   return false;
 }
}
function money(x){return Math.round(Number(x)||0).toLocaleString('uk-UA')}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function id(){return Date.now()+Math.random()}
function syncVehicleMileage(){
  // Recalculate current odometer from the vehicle's base odometer plus assigned trip mileage.
  // Never double-count previously synchronized trips.
  (db.vehicles||[]).forEach((v,vi)=>{
    const base=Number(v.baseOdo||0);
    const added=(db.trips||[]).reduce((sum,t)=>{
      const assigned=String(t.vehicleId??'')===String(vi) || String(t.vehicleNumber||'')===String(v.number||'');
      return assigned ? sum+Number(t.total||0) : sum;
    },0);
    v.currentOdo=base+added;
  });
}

function findDistance(from,to){
  const a=String(from||'').trim().toUpperCase();
  const b=String(to||'').trim().toUpperCase();
  if(!a || !b) return 0;
  const list=Array.isArray(db.distances)?db.distances:[];
  const exact=list.find(d=>String(d.from||'').trim().toUpperCase()===a && String(d.to||'').trim().toUpperCase()===b);
  if(exact) return Number(exact.km)||0;
  const reverse=list.find(d=>String(d.from||'').trim().toUpperCase()===b && String(d.to||'').trim().toUpperCase()===a);
  return reverse ? (Number(reverse.km)||0) : 0;
}

function calc(t){
 t.total=Number(t.empty||0)+Number(t.loaded||0); if(!t.routeDistance) t.routeDistance=findDistance(t.loadCity,t.unloadCity)||0;
 if(t.imported && !t.dirty){
   t.fuel=Number(t.legacyFuel||0);
   t.tax=Number(t.legacyTax||0);
   t.fuelCost=Number(t.legacyFuelCost||0);
   t.profit=Number(t.legacyProfit||0);
   t.profitHour=Number(t.hours||0)>0?t.profit/Number(t.hours):0;
   return;
 }
 t.fuel=Number(t.empty||0)*.28+Number(t.loaded||0)*.34;
 t.tax=Number(t.taxable||0)*.06;
 t.fuelCost=t.fuel*Number(t.fuelPrice||0);
 t.profit=Number(t.freight||0)-Number(t.perDiem||0)-Number(t.logistics||0)-Number(t.other||0)-t.tax-t.fuelCost;
 t.profitHour=Number(t.hours||0)>0?t.profit/Number(t.hours):0;
}
function layout(title,html){document.getElementById('app').innerHTML=`<h2>${title}</h2>${html}`}
function table(headers,rows){return `<div style="overflow:auto"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
function page(p){
 document.querySelectorAll('#nav button,[data-page]').forEach(b=>{if(b.dataset.page)b.classList.toggle('active',b.dataset.page===p)});
 if(p==='dashboard') return dashboard();
 if(p==='trips') return trips();
 if(p==='expenses') return expenses();
 if(p==='funds') return funds();
 if(p==='customers') return customers();
 if(p==='drivers') return drivers(); if(p==='logisticians') return logisticians();
 if(p==='vehicles') return vehicles();
 if(p==='cities') return cities();
 if(p==='distances') return distances();
 if(p==='debtors') return debtors();
  if(p==='reports') return reports();
 if(p==='backup') return backup();
}
function dashboard(){
 const received=db.trips.filter(t=>t.payment==='так').reduce((s,t)=>s+Number(t.freight||0),0);
 syncVehicleMileage(); const profit=db.trips.reduce((s,t)=>s+Number(t.profit||0),0);
 const expenses=db.trips.reduce((s,t)=>s+Number(t.perDiem||0)+Number(t.logistics||0)+Number(t.other||0)+Number(t.tax||0)+Number(t.fuelCost||0),0)+db.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
 layout('Головна',`<div class="kpis"><div class="kpi">Рейсів<b>${db.trips.length}</b></div><div class="kpi">Отримані кошти<b>${money(received)}</b></div><div class="kpi">Прибуток<b>${money(profit)}</b></div><div class="kpi">Витрати<b>${money(expenses)}</b></div></div><div class="card"><h3>Дані перенесено — ProMax 2.0 готовий до роботи</h3><p>Існуючі дані з «ProMax_ФІНАЛЬНИЙ_КОШТИ» перенесені в систему. Можеш продовжувати роботу та додавати нові записи. Дані автоматично зберігаються у цьому браузері.</p><p class="small">Паливо: порожній пробіг 28 л/100 км; завантажений 34 л/100 км. Податок: 6%.</p>
    <div class="detail-box"><b>Контроль мастила:</b> ${(db.vehicles||[]).filter(v=>Number(v.lastOilKm||0)>0 && Number(v.oilInterval||10000)-(Number(v.currentOdo||0)-Number(v.lastOilKm||0))<=0).length} автомобілів потребують заміни.</div></div>`);
}
function trips(){
  syncVehicleMileage();
  const options=db.logisticians.map((l,i)=>`<option value="${i}">${esc(l.name)}</option>`).join('');
  const driverOptions=(db.drivers||[]).map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('');
  const vehicleOptions=(db.vehicles||[]).map((v,i)=>`<option value="${i}">${esc(v.number)} — ${esc(v.model)}</option>`).join('');
  const form=`<div class="card"><h3>Додати рейс</h3><div class="grid">
    ${field('Замовник','customer')}${field('Дата завантаження','loadDate','date')}${field('Дата розвантаження','unloadDate','date')}
    ${cityField('Місце завантаження','loadCity')}${cityField('Місце розвантаження','unloadCity')}${field('Відстань маршруту, км','routeDistance','number')}
    ${field('Порожній пробіг, км','empty','number')}${field('Завантажений пробіг, км','loaded','number')}${field('Ціна палива, грн/л','fuelPrice','number')}
    ${field('Фрахт, грн','freight','number')}${field('Сума під оподаткування','taxable','number')}${field('Добові','perDiem','number')}
    ${field('Логістика','logistics','number')}${field('Інші витрати','other','number')}${field('Години в дорозі','hours','number')}${field('Отримувач','receiver')}
    <div><label>Водій</label><select id="driver"><option value="">— не вибрано —</option>${driverOptions}</select></div>
    <div><label>Автомобіль</label><select id="vehicle"><option value="">— не вибрано —</option>${vehicleOptions}</select></div>
    <div><label>Логіст</label><select id="logistician" onchange="showLogisticInfo()"><option value="">— не вибрано —</option>${options}</select></div>
    <div><label>Телефон логіста</label><input id="logPhone" readonly></div><div><label>Оцінка співпраці</label><input id="logRating" readonly></div>
    <div><label>Статус рейсу</label><select id="status"><option>Запланований</option><option>Завантаження</option><option>В дорозі</option><option>Розвантажено</option><option>Очікує оплату</option><option>Оплачено</option></select></div>
  </div><p><label>Оплата рейсу</label><select id="payment"><option>ні</option><option>так</option></select></p>
  <button class="primary" onclick="addTrip()">Зберегти рейс</button></div>`;

  const rows=db.trips.map((t,i)=>{
    calc(t); const p=Number(t.freight||0), ex=p-Number(t.profit||0), margin=p?Math.round(Number(t.profit||0)/p*100):0;
    const status=t.status|| (t.payment==='так'?'Оплачено':'Очікує оплату');
    const docs=(db.tripDocuments||[]).filter(d=>String(d.tripId)===String(t.uid) || Number(d.tripId)===i); const signed=docs.some(d=>d.type==='ТТН' && d.note==='Підписана');
    const docStatus=docs.length===0?'Немає':(docs.length>=2?'Повний комплект':'Частково');

function uploadTripDocument(i){

   const item={id:'doc_'+Date.now()+'_'+Math.random().toString(36).slice(2),tripId:db.trips[i]?.uid||i,type,name:f.name,date:new Date().toISOString().slice(0,10),data:r.result,note:type==='ТТН'?'Очікується':''};

function getReportRange(){
 const type=document.getElementById('reportType').value;
 if(type==='custom'){
   return [document.getElementById('reportStart').value,document.getElementById('reportEnd').value];
 }
 const v=document.getElementById('reportDate').value;
 if(!v) return [null,null];
 if(type==='month') return [v+'-01', new Date(new Date(v+'-01T00:00:00').getFullYear(),new Date(v+'-01T00:00:00').getMonth()+1,0).toISOString().slice(0,10)];
 const d=new Date(v+'T00:00:00');
 if(type==='day') return [v,v];
 if(type==='week'){
   const day=d.getDay()||7; const s=new Date(d); s.setDate(d.getDate()-day+1);
   const e=new Date(s); e.setDate(s.getDate()+6);
   return [s.toISOString().slice(0,10),e.toISOString().slice(0,10)];
 }
 if(type==='decade'){
   const day=d.getDate(); let a,b;
   if(day<=10){a=1;b=10}else if(day<=20){a=11;b=20}else{a=21;b=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
   const s=new Date(d.getFullYear(),d.getMonth(),a), e=new Date(d.getFullYear(),d.getMonth(),b);
   return [s.toISOString().slice(0,10),e.toISOString().slice(0,10)];
 }
 return [null,null];
}

  const fuelPurchases=expenses.filter(e=>e.fuel==='так').reduce((s,e)=>s+Number(e.amount||0),0);
  const allExpenses=perDiem+logistics+other+tax+fuelCost+externalNonFuel+fuelPurchases;
  const profit=trips.reduce((s,t)=>s+Number(t.profit||0),0)-externalNonFuel-fuelPurchases;
  const currentFunds=paid-perDiem-logistics-other-tax-externalNonFuel-fuelPurchases;
  const km=trips.reduce((s,t)=>s+Number(t.total||0),0), liters=trips.reduce((s,t)=>s+Number(t.fuel||0),0);
  const profitKm=km?profit/km:0, costKm=km?allExpenses/km:0, margin=freight?profit/freight*100:0;

  const expenseParts=[['Паливо за рейсами',fuelCost],['Закупівля палива',fuelPurchases],['Добові',perDiem],['Логістика',logistics],['Інші витрати',other+externalNonFuel],['Податок',tax]].filter(x=>x[1]>0);
  const maxExpense=Math.max(...expenseParts.map(x=>x[1]),1);

  const totalPie=expenseParts.reduce((s,x)=>s+x[1],0)||1; let angle=0;

  const stops=expenseParts.map((x,i)=>{const next=angle+x[1]/totalPie*360;const p=`${pieColors[i%pieColors.length]} ${angle}deg ${next}deg`;angle=next;return p;}).join(',');

    const rv=Number(remote.version||0),lv=Number(localStorage.getItem('promax_server_version')||0);

    const nextVersion=Number(remote?.version||0)+1;
    const {data,error}=await supabaseClient.from('promax_state').update({version:nextVersion,state:syncData(),updated_by:promaxUser.id,updated_at:new Date().toISOString()}).eq('workspace',SUPABASE_WORKSPACE).select().single();
    if(error)throw error;
    localStorage.setItem('promax_server_version',String(data.version));localStorage.setItem('promax_last_cloud_update',data.updated_at);syncDirty=false;syncStatus('🟢 Центральну базу відновлено · версія '+data.version,true);alert('Центральну базу оновлено.');return true;
  }catch(e){alert('Не вдалося відновити центральну базу.\n\n'+(e.message||e));return false;}
}
function syncNow(){return cloudPull(true);}
function scheduleCloudPush(){syncDirty=true;clearTimeout(syncTimer);if(syncConfigured())syncTimer=setTimeout(()=>cloudPush(false),700);}
function startSyncPolling(){if(!syncConfigured())return;setTimeout(()=>cloudPull(false),300);}
function setupRealtime(){
  if(supaChannel){supabaseClient.removeChannel(supaChannel);supaChannel=null;}
  if(!syncConfigured())return;
  supaChannel=supabaseClient.channel('promax-state-live').on('postgres_changes',{event:'*',schema:'public',table:'promax_state',filter:'workspace=eq.'+SUPABASE_WORKSPACE},payload=>{
    const rv=Number(payload.new?.version||0),lv=Number(localStorage.getItem('promax_server_version')||0);
    if(rv>lv&&!syncBusy&&!syncDirty)cloudPull(false);
    else if(rv>lv&&syncDirty)syncStatus('🟠 Є нові зміни на іншому пристрої · збережіть/перевірте свої дані',false);
  }).subscribe();
}
async function initSupabaseAuth(){
  const {data,error}=await supabaseClient.auth.getSession();
  if(error)console.error(error);
  if(data?.session){promaxUser=data.session.user;await loadPromaxProfile();return;}
  showLogin();
}
async function loadPromaxProfile(){
  const {data,error}=await supabaseClient.from('profiles').select('id,full_name,role,active').eq('id',promaxUser.id).maybeSingle();
  if(error)throw error;
  promaxProfile=data;
  if(data&&!data.active){await supabaseClient.auth.signOut();promaxUser=null;alert('Ваш обліковий запис деактивований.');showLogin();return;}
  setupRealtime();ensureVehiclePhoto();startSyncPolling();page('dashboard');
}
async function loginSupabase(email,password){
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)throw error;
  promaxUser=data.user;await loadPromaxProfile();
}
async function logoutProMax(){await supabaseClient.auth.signOut();if(supaChannel){await supabaseClient.removeChannel(supaChannel);supaChannel=null;}promaxUser=null;promaxProfile=null;showLogin();}
function showLogin(){
  const old=document.getElementById('loginOverlay');if(old)old.remove();
  const overlay=document.createElement('div');overlay.id='loginOverlay';
  overlay.innerHTML=`<div id="loginBox"><h2>🔐 ProMax</h2><p>Увійдіть у хмарну систему ProMax.</p><div id="loginError"></div><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="Ваш email"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль"><button class="primary" id="loginBtn">Увійти</button><p class="small" style="margin-top:14px">Початковий пароль ProMax: <b>123456</b>. Після входу його можна змінити у «Резервна копія». Новий пароль буде спільним для Windows і смартфона.</p></div>`;
  document.body.appendChild(overlay);
  const email=document.getElementById('loginEmail'),pass=document.getElementById('loginPassword'),btn=document.getElementById('loginBtn'),err=document.getElementById('loginError');
  async function go(){err.textContent='';btn.disabled=true;btn.textContent='Вхід…';try{await loginSupabase(email.value.trim(),pass.value);overlay.remove();}catch(e){err.textContent='Помилка входу: '+(e.message||'перевірте email і пароль');}finally{btn.disabled=false;btn.textContent='Увійти';}}
  btn.onclick=go;pass.addEventListener('keydown',e=>{if(e.key==='Enter')go();});email.addEventListener('keydown',e=>{if(e.key==='Enter')pass.focus();});setTimeout(()=>email.focus(),100);
}
async function setInitialCloudPassword(){
  if(!promaxUser){alert('Спочатку увійдіть у ProMax.');return;}
  if(!confirm('Встановити пароль ProMax: 123456?\n\nПісля цього цей самий пароль можна використовувати на Windows і смартфоні.'))return;
  try{const {error}=await supabaseClient.auth.updateUser({password:'123456'});if(error)throw error;alert('Початковий пароль 123456 встановлено. Тепер він працює на всіх пристроях.');}
  catch(e){alert('Не вдалося встановити пароль.\n\n'+(e.message||e));}
}
async function changeCloudPassword(){
  if(!promaxUser){alert('Спочатку увійдіть у ProMax.');return;}
  const next=prompt('Введіть новий пароль ProMax (мінімум 6 символів):');
  if(next===null)return;
  if(next.length<6){alert('Пароль має містити щонайменше 6 символів.');return;}
  const confirmNext=prompt('Повторіть новий пароль:');
  if(confirmNext!==next){alert('Паролі не збігаються.');return;}
  try{const {error}=await supabaseClient.auth.updateUser({password:next});if(error)throw error;alert('Пароль ProMax успішно змінено. Новий пароль працюватиме на Windows і смартфоні.');}
  catch(e){alert('Не вдалося змінити пароль.\n\n'+(e.message||e));}
}
function cloudSettings(){
  const name=promaxProfile?.full_name||promaxUser?.email||'Користувач';
  const isAdmin=promaxProfile?.role==='admin';
  const role=isAdmin?'Адміністратор':'Водій';
  layout('Хмарна синхронізація',`<div class="card"><h3>☁️ ProMax Cloud</h3><p><b>Користувач:</b> ${esc(name)}</p><p><b>Роль:</b> ${role}</p><p><b>Центральна база:</b> Supabase · workspace <b>${SUPABASE_WORKSPACE}</b></p><div id="syncStatus" class="small">${syncConfigured()?'🟢 Підключено до хмари':'🟡 Не підключено'}</div><p><button class="edit" onclick="cloudPull(true)">⬇️ Отримати центральну базу</button> <button class="primary" onclick="syncNow()">🔄 Синхронізувати зараз</button></p>${isAdmin?`<p><button class="edit" onclick="bootstrapLocalToServer()">⬆️ Передати локальну базу</button> <button class="danger" onclick="forceRestoreCentralFromLocal()">🔴 Відновити центральну базу з цього пристрою</button></p>`:''}<p class="small">Синхронізація працює напряму через Інтернет із Supabase. ПК не потрібно залишати увімкненим для доступу водія.</p><p><button class="danger" onclick="logoutProMax()">🚪 Вийти</button></p></div>`);
}
function backup(){layout('Резервна копія',`<div class="card"><p>Збереження локальної копії та хмарна синхронізація.</p><button class="primary" onclick="exportDB()">Експорт бази</button> <button class="primary" onclick="importDB()">Імпорт бази</button> <button class="edit" onclick="cloudSettings()">☁️ Хмарна синхронізація</button><button class="edit" onclick="changeCloudPassword()">🔑 Змінити пароль ProMax</button><button class="edit" onclick="setInitialCloudPassword()">🔐 Встановити початковий пароль 123456</button><input type="file" id="imp" accept=".json" style="display:none" onchange="doImport(event)"><p class="small">Пароль ProMax є паролем вашого хмарного облікового запису. Після встановлення 123456 він однаковий на Windows і смартфоні.</p></div>`);}

// Supabase Auth replaces the old local-only password gate.
supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(session&&session.user){promaxUser=session.user;setTimeout(()=>loadPromaxProfile().catch(e=>{console.error(e);alert('Не вдалося завантажити профіль: '+(e.message||e));}),0);}
  else if(event==='SIGNED_OUT'){promaxUser=null;promaxProfile=null;}
});
initSupabaseAuth();

</script>
</body></html>
